name: Monthly Nightly Unified Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - branch: main
            label: Main
            filename: lRP-Main
          - branch: main-extra/pure-glass
            label: Main Extra Pure Glass
            filename: lRP-C.E.-Pure-Glass
          - branch: main-extra/CRI
            label: Main Extra Crop Ready Indicator
            filename: lRP-C.E.-CRI
          - branch: main-extra/april-fool
            label: Main Extra April Fool
            filename: lRP-C.E.-April-Fool
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.MODRINTH_GITHUB_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/pack.py release \
            --label '${{ matrix.label }}' \
            --filename '${{ matrix.filename }}'

  aggregate:
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Build aggregate release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/pack.py aggregate

name: Publish to Modrinth

on:
  workflow_run:
    workflows: [Monthly Nightly Unified Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find latest nightly release
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag=$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("Nightly-"))) | sort_by(.createdAt) | last | .tagName')

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No Nightly release found"
            exit 1
          fi

          gh release view "$tag" --json tagName,name,body,isPrerelease > release.json
          echo "tag=$(jq -r .tagName release.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name release.json)" >> "$GITHUB_OUTPUT"
          echo "channel=$(jq -r 'if .isPrerelease then "alpha" else "release" end' release.json)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_BODY'
            jq -r .body release.json
            echo 'RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Download aggregate asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download '${{ steps.release_info.outputs.tag }}' \
            --dir dist \
            --pattern 'lRP-Main-All.zip'

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2.5.3
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: PUZix5YC
          name: ${{ steps.release_info.outputs.name }}
          version: ${{ steps.release_info.outputs.tag }}
          changelog: ${{ steps.release_info.outputs.body }}
          channel: ${{ steps.release_info.outputs.channel }}
          loaders: minecraft
          game-versions: |-
            25w14craftmine
            1.21.x
            26w14a
            26.x
          files: dist/lRP-Main-All.zip
          primary-file: lRP-Main-All.zip
          file-types: lRP-Main-All.zip=required-resource-pack
